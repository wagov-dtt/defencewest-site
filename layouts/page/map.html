{{/* Standalone map page using shared MapLibre embed. */}}
{{- $cdn := .Site.Params.cdnUrl -}}
{{- $mapStyleUrl := .Site.Params.mapStyleUrl -}}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-base-url="{{ "/" | relURL }}" data-map-style-url="{{ $mapStyleUrl }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Map | {{ .Site.Title }}</title>
  <base target="_top">
  <link rel="stylesheet" href="{{ $cdn }}/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ $cdn }}/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ "styles.css" | relURL }}">
</head>
<body class="standalone-map-page">
  {{ partial "map-embed.html" (dict "page" . "id" "standalone-map" "classes" "map-embed map-embed--standalone") }}
  <script>window.TAXONOMIES = {{ .Site.Params.taxonomyOrder | jsonify | safeJS }};</script>
  <script src="{{ "filter-utils.js" | relURL }}"></script>
  <script src="{{ $cdn }}/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script src="{{ "map-embed.js" | relURL }}"></script>
</body>
</html>
